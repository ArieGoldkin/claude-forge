name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Shared hooks-infra library tests (lock, dangerous-bash, input, guards, …).
  shared-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/hooks-infra/package-lock.json
      - run: npm ci
        working-directory: shared/hooks-infra
      - run: npm test
        working-directory: shared/hooks-infra

  # Maintainer-only sandbox launcher (ADR-0001 / issue #45). Lives outside the
  # plugin trees on purpose — it carries the provider SDK, which must never
  # reach an installer — but it still needs CI. Code that nothing runs is how
  # the inert-handler class survived three releases.
  sandbox-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/sandbox-launcher/package-lock.json
      # The launcher imports the shared sandbox registry directly, so vitest and
      # tsc both resolve shared/hooks-infra/tsconfig.json — which `extends`
      # @tsconfig/node22 from *that* package's node_modules. Without this step
      # the job fails on a missing module rather than anything real.
      - name: Install shared hooks-infra deps
        run: npm ci
        working-directory: shared/hooks-infra
      - run: npm ci
        working-directory: tools/sandbox-launcher
      - name: Typecheck
        run: npm run typecheck
        working-directory: tools/sandbox-launcher
      - name: Test
        run: npm test
        working-directory: tools/sandbox-launcher

  # Per-plugin lint + typecheck + test. Each plugin's hooks depend on the
  # shared library via symlinks, so shared deps are installed first.
  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - continuity-toolkit
          - devops-toolkit
          - ai-toolkit
          - frontend-toolkit
          - engineering-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/hooks/package-lock.json
      - name: Install shared hooks-infra deps
        run: npm ci
        working-directory: shared/hooks-infra
      - name: Install plugin hooks deps
        run: npm ci
        working-directory: plugins/${{ matrix.plugin }}/hooks
      - name: Lint
        run: npm run lint
        working-directory: plugins/${{ matrix.plugin }}/hooks
      - name: Typecheck
        run: npm run typecheck
        working-directory: plugins/${{ matrix.plugin }}/hooks
      - name: Test
        run: npm test
        working-directory: plugins/${{ matrix.plugin }}/hooks

  # Rejects top-level `themes`/`monitors` keys in plugin manifests
  # (must be nested under `experimental`, CC v2.1.129+).
  manifest-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bad-themes-at-root must fail
        run: "! bash scripts/validate-manifest-shape.sh tests/fixtures/manifest-shape/bad-themes-at-root.json"
      - name: bad-monitors-at-root must fail
        run: "! bash scripts/validate-manifest-shape.sh tests/fixtures/manifest-shape/bad-monitors-at-root.json"
      - name: good-nested-experimental must pass
        run: bash scripts/validate-manifest-shape.sh tests/fixtures/manifest-shape/good-nested-experimental.json

  # Every plugin must run the same SET of lib tests as shared/, as the same files.
  # src/lib is symlinked into every plugin, so all six trees run identical code;
  # when the tests were copies they drifted up to 735 lines and five suites passed
  # against a stale spec (#60). A `cp` reintroduces that silently, so the
  # invariant is structural.
  #
  # The five negatives deliberately span FIVE DIFFERENT PLUGINS and FIVE
  # DIFFERENT FILES. An earlier version mutated one file in one plugin three
  # times; a deliberately crippled guard that inspected exactly that one path and
  # ignored the rest of the tree passed all of it. Branch coverage is not
  # traversal coverage — diversity here is what proves the guard is applied to
  # the whole repo, not merely that its checks fire.
  shared-test-symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: real repo must pass
        run: bash scripts/validate-shared-test-symlinks.sh
      # Exit code must be exactly 1 (a drift finding). Bare `! cmd` would also
      # pass on exit 2, the script's "environment broken" code — which is how a
      # guard that validates nothing looks green.
      - name: 'devops: a real file where shared has one must fail'
        run: |
          T=plugins/devops-toolkit/hooks/tests/lib/guards.test.ts
          rm "$T" && cp shared/hooks-infra/tests/lib/guards.test.ts "$T"
          bash scripts/validate-shared-test-symlinks.sh && rc=0 || rc=$?
          git checkout -- "$T"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
      - name: 'ai-toolkit: a broken symlink must fail'
        run: |
          T=plugins/ai-toolkit/hooks/tests/lib/input.test.ts
          rm -f "$T" && ln -s ../../../../shared/hooks-infra/tests/lib/input.test.ts "$T"
          bash scripts/validate-shared-test-symlinks.sh && rc=0 || rc=$?
          git checkout -- "$T"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
      - name: 'frontend-toolkit: a link to the wrong shared file must fail'
        run: |
          T=plugins/frontend-toolkit/hooks/tests/lib/output.test.ts
          rm -f "$T" && ln -s ../../../../../shared/hooks-infra/tests/lib/guards.test.ts "$T"
          bash scripts/validate-shared-test-symlinks.sh && rc=0 || rc=$?
          git checkout -- "$T"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
      - name: 'engineering-toolkit: a DELETED link must fail'
        run: |
          T=plugins/engineering-toolkit/hooks/tests/lib/logging.test.ts
          rm -f "$T"
          bash scripts/validate-shared-test-symlinks.sh && rc=0 || rc=$?
          git checkout -- "$T"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
      - name: 'continuity-toolkit: a renamed stale copy must fail'
        run: |
          T=plugins/continuity-toolkit/hooks/tests/lib/output-plugin.test.ts
          cp shared/hooks-infra/tests/lib/output.test.ts "$T"
          bash scripts/validate-shared-test-symlinks.sh && rc=0 || rc=$?
          rm -f "$T"
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }
      - name: tree restored after the negatives
        if: always()
        run: |
          git checkout -- plugins/ && git clean -fd plugins/
          bash scripts/validate-shared-test-symlinks.sh

  # Version consistency across plugin.json / marketplace.json / CHANGELOG /
  # README / both CLAUDE.md files. Previously enforced by neither CI nor an
  # installed git hook -- Release Checklist compliance rested on agent memory,
  # and ftk's skill count had already drifted. Negative fixtures guard against
  # the "silently validated nothing" failure mode this script has a history of.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: real repo must pass
        run: bash scripts/validate-versions.sh
      - name: good fixture must pass
        run: bash scripts/validate-versions.sh tests/fixtures/versions/good
      - name: bad-marketplace fixture must fail
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-marketplace"
      - name: bad-changelog fixture must fail
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-changelog"
      # Check 6 (#63/#74): the log-level variable's name must agree across the
      # wrapper, vitest.config.ts and CLAUDE.md. Check 6 skips a plugin with no
      # wrapper, so without these fixtures deleting the whole block would leave
      # the real-repo run at exit 0 and CI green.
      - name: bad-logvar fixture must fail (docs name a variable production never reads)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-logvar"
      # Checks 7 and 8: counts and the plugin README version. Without these three
      # fixtures, deleting either check leaves the real-repo run at exit 0 and CI
      # green -- the same hole the bad-logvar fixtures exist to close for check 6.
      # Each fixture differs from `good` by exactly ONE line and passes again when
      # that line is corrected, so it can only be failing for its own reason.
      # Check 7 reads SIX sites. One fixture per site, because a fixture that only
      # covers plugin.json pins "check 7 exists", not "each extractor works" -- the
      # same whole-vs-parts gap the check itself was written to close. Verified by a
      # crippled-check matrix: killing each extractor in turn flips EXACTLY the one
      # fixture below and no other, and `good` keeps passing throughout.
      - name: bad-counts fixture must fail (S1 plugin.json description)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-counts"
      - name: bad-counts-marketplace fixture must fail (S2 marketplace.json description)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-counts-marketplace"
      - name: bad-counts-root-readme fixture must fail (S3 root README counts column)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-counts-root-readme"
      - name: bad-counts-root-claude fixture must fail (S4 root CLAUDE.md summary table)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-counts-root-claude"
      - name: bad-counts-plugin-readme fixture must fail (S6 plugin README + the FORM_B parser)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-counts-plugin-readme"
      - name: bad-count-list fixture must fail (right total, wrong names in the list)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-count-list"
      - name: bad-readme-version fixture must fail (plugin README pins a stale version)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-readme-version"
      - name: bad-plugin-id fixture must fail (name is not a valid shell identifier)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-plugin-id"
      - name: bad-test-identity fixture must fail (tests run as a different plugin than production)
        run: "! bash scripts/validate-versions.sh tests/fixtures/versions/bad-test-identity"

  # Static plugin-structure validation via the Claude Code CLI. Non-blocking
  # (mirrors the GitLab `allow_failure: true`): the CLI install/validate path
  # may not be available in every fork.
  validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - continuity-toolkit
          - devops-toolkit
          - ai-toolkit
          - frontend-toolkit
          - engineering-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugins/${{ matrix.plugin }}

  # Secret scanning — the enforced CI-side gate. The .pre-commit gitleaks hook
  # is local-only and bypassable; this job is not. Uses the repo's .gitleaks.toml.
  # gitleaks-action is license-free for public repositories and individual
  # accounts (a GITLEAKS_LICENSE is only required for GitHub *organizations*).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
